[package]
name = "crustache"
description = "Rust implementation of the Mustache template language"
repository = "https://github.com/ivoilic/crustache"
documentation = "https://docs.rs/crustache"
# Keep `version` in sync with `package.json` when using Changesets.
version = "0.10.0"
license = "MIT"
edition = "2021"
rust-version = "1.70"
autotests = false

[features]
default = []
unstable = []

[dependencies]
log = "0.4"
serde = { version = "1.0.210", features = ["std"] }

[dev-dependencies]
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[[test]]
name = "suite"
path = "tests/suite.rs"
