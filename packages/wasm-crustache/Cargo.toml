[package]
name = "wasm-crustache"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WebAssembly wrapper for crustache"
repository = "https://github.com/ivoilic/crustache"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crustache = { path = "../crustache" }
serde = "1"
serde-wasm-bindgen = "0.6"
serde_json = "1"
wasm-bindgen = "0.2.105"

# Bundled wasm can exceed older wasm-opt MVP limits; the Rust linker already optimizes release builds.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
