# Block merges on red CI: protect `main` and require status check "CI / Test"
# (Settings → Branches → branch protection rule, or Settings → Rules → rulesets).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust tests
        run: cargo test -p crustache

      - name: Run JS tests
        run: pnpm test

  # Sticky CI summary on PRs (same-repo only; fork PRs cannot post per
  # https://github.com/marketplace/actions/create-or-update-comment )
  ci-pr-comment:
    name: PR CI summary
    needs: test
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Find CI status comment
        uses: peter-evans/find-comment@v4
        id: find-ci
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- ci-status -->'

      - name: Create or update CI status comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-ci.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- ci-status -->
            ## CI ${{ needs.test.result == 'success' && 'passed' || 'failed' }}

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            | Job | Result |
            | --- | --- |
            | Test | ${{ needs.test.result }} |
